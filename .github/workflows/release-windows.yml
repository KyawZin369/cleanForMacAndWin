name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Re-sync Khine patches/adapters (WinMole source is vendored in vendor/WinMole).
      - name: Prepare WinMole vendor
        run: powershell -ExecutionPolicy Bypass -File scripts/setup_winmole_vendor.ps1

      - name: Remove stale build symlink
        shell: bash
        run: |
          if [ -L build ] || { [ -e build ] && [ ! -d build ]; }; then
            rm -rf build
          fi

      - name: Build Windows release installers
        run: powershell -ExecutionPolicy Bypass -File scripts/release_windows.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khine-windows
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
